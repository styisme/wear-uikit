name: Build Uikit

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle 5.6.4 (Mirror)
        run: |
          echo "Downloading Gradle 5.6.4 from Tencent Mirror..."
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 -o gradle-5.6.4-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-5.6.4-bin.zip
          echo "Verifying downloaded file..."
          [ -s gradle-5.6.4-bin.zip ] || { echo "Download failed: file is empty"; exit 1; }
          unzip -qo gradle-5.6.4-bin.zip
          echo "$PWD/gradle-5.6.4/bin" >> $GITHUB_PATH




      - name: Setup Gradle 5.6.4 (Mirror)
        run: |
          echo "Downloading Gradle 5.6.4 from Tencent Mirror..."
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 -o gradle-5.6.4-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-5.6.4-bin.zip
          echo "Verifying downloaded file..."
          [ -s gradle-5.6.4-bin.zip ] || { echo "Download failed: file is empty"; exit 1; }
          unzip -qo gradle-5.6.4-bin.zip
          echo "$PWD/gradle-5.6.4/bin" >> $GITHUB_PATH


      - name: Upload Demo APK
        uses: actions/upload-artifact@v4
        with:
          name: uikit-demo-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: "**/build/outputs/logs/*.txt"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AAR
        uses: actions/download-artifact@v4
        with:
          name: uikit-aar
          path: ./release_files

      - name: Download Demo APK
        uses: actions/download-artifact@v4
        with:
          name: uikit-demo-apk
          path: ./release_files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
