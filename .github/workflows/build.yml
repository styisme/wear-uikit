name: Build & Test

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30 build-tools;30.0.3 platform-tools'

      - name: Set up JDK 8 Zulu
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          java-package: jdk

      - name: Point JAVA_HOME to JDK 8
        run: |
          if [ -n "$JAVA_HOME_8_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 5.6.4
        run: |
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 -o gradle-5.6.4-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-5.6.4-bin.zip
          unzip -qo gradle-5.6.4-bin.zip
          echo "$PWD/gradle-5.6.4/bin" >> $GITHUB_PATH

      - name: Build Library & Demo
        run: gradle :uikit:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Collect Artifacts
        run: |
          mkdir -p final_artifacts
          find . -name "*.aar" -not -path "*/tmp/*" -exec cp {} final_artifacts/ \;
          find . -name "*.apk" -not -path "*/tmp/*" -exec cp {} final_artifacts/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-build
          path: final_artifacts/*
