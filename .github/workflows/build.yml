name: Build & Release Uikit

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 初始化 Android SDK (用 JDK 17 跑 sdkmanager)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-30 build-tools;30.0.3 platform-tools'

      # 2. 切换回专属的 JDK 8
      - name: Set up JDK 8 Zulu
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          java-package: jdk

      - name: Point JAVA_HOME to JDK 8
        run: |
          if [ -n "$JAVA_HOME_8_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_8_X64" >> $GITHUB_ENV
          fi

      # 3. 极速下载 Gradle (国内镜像 + 防卡死 + 强制覆盖)
      - name: Setup Gradle 5.6.4
        run: |
          echo "Downloading Gradle 5.6.4..."
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 -o gradle-5.6.4-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-5.6.4-bin.zip
          [ -s gradle-5.6.4-bin.zip ] || { echo "Download failed"; exit 1; }
          unzip -qo gradle-5.6.4-bin.zip
          echo "$PWD/gradle-5.6.4/bin" >> $GITHUB_PATH

      # 4. 一步到位编译出 AAR 和 APK
      - name: Build Library & Demo
        run: gradle :uikit:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      # 5. 暴力全盘抓取产物，绝对不漏
      - name: Collect Artifacts
        run: |
          mkdir -p final_artifacts
          find . -name "*.aar" -not -path "*/tmp/*" -exec cp {} final_artifacts/ \;
          find . -name "*.apk" -not -path "*/tmp/*" -exec cp {} final_artifacts/ \;
          echo "=== Found artifacts: ==="
          ls -la final_artifacts/

      # 6. 上传
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uikit-builds
          path: final_artifacts/*
          if-no-files-found: error

  # 自动发版任务 (仅当推送 v* tag 时触发)
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: uikit-builds
          path: ./release_files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
